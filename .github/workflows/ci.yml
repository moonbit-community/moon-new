name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = "latest"
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate both backends and the package archive
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) test "$(uname -m)" = arm64 ;;
            *) test "$(uname -m)" = x86_64 ;;
          esac
          moon version --all
          moon update
          for target in native wasm; do
            moon check --target "$target" --deny-warn
            moon build --target "$target"
          done
          moon test --target native
          moon test --target wasm
          MOON_NEW_TEST_TARGET=wasm moon test tests/cli_test.mbt --target native
          MOON_NEW_TEST_TARGET=wasm moon test tests/template_cli_test.mbt --target native
          moon info
          moon fmt
          git diff --exit-code
